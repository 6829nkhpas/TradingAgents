services:
  research-api:
    build: .
    env_file:
      - .env
    environment:
      TRADINGAGENTS_API_HOST: 0.0.0.0
      TRADINGAGENTS_API_PORT: 8000
    # Published on the loopback interface only: the API is unauthenticated
    # unless TRADINGAGENTS_API_KEY is set.
    ports:
      - "127.0.0.1:${TRADINGAGENTS_API_PORT:-8000}:8000"
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  research-api-ollama:
    build: .
    env_file:
      - .env
    environment:
      TRADINGAGENTS_API_HOST: 0.0.0.0
      TRADINGAGENTS_API_PORT: 8000
      TRADINGAGENTS_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434/v1
    ports:
      - "127.0.0.1:${TRADINGAGENTS_API_PORT:-8000}:8000"
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      - ollama
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
