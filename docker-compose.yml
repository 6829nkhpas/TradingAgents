services:
  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  research-api:
    build:
      context: .
      args:
        INSTALL_API: "true"
    env_file:
      - .env
    environment:
      TRADINGAGENTS_API_HOST: 0.0.0.0
      TRADINGAGENTS_API_PORT: ${TRADINGAGENTS_API_PORT:-8000}
    ports:
      - "${TRADINGAGENTS_API_PORT:-8000}:${TRADINGAGENTS_API_PORT:-8000}"
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    entrypoint: ["tradingagents-api"]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
